<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Travels</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h1>🌍 My Travels</h1>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="seg" id="view-toggle">
      <button data-mode="all" class="active">All</button>
      <button data-mode="countries">Countries</button>
      <button data-mode="parks">Parks</button>
    </div>
    <a href="visited.html">Visited lists →</a>
    <button class="btn" id="btn-friends">Friends</button>
    <button class="btn" id="btn-account">Sign in</button>
    <button class="btn" id="btn-reset">Reset view</button>
    <button class="btn" id="btn-export" title="Download my-travels.js to commit to git">Export</button>
    <button class="btn" id="btn-clear" title="Drop browser edits, back to the committed file">Clear local edits</button>
  </div>

  <svg id="globe"></svg>

  <div class="legend" id="legend-default">
    <div class="row"><span class="swatch" style="background: var(--visited)"></span> Visited</div>
    <div class="row"><span class="swatch" style="background: var(--lived)"></span> Lived</div>
    <div class="row"><span class="swatch" style="background: var(--land)"></span> Not yet</div>
    <div class="hint">Drag to spin · scroll to zoom · click to mark</div>
    <div class="hint" id="park-hint">Zoom in on the US to see park pins 📍</div>
  </div>

  <div class="legend" id="legend-compare" style="display: none">
    <div class="row"><span class="swatch" style="background: var(--accent)"></span> Both of you</div>
    <div class="row"><span class="swatch" style="background: var(--visited)"></span> Only you</div>
    <div class="row"><span class="swatch" style="background: var(--lived)"></span> Only <span id="legend-their-name"></span></div>
    <div class="row"><span class="swatch" style="background: var(--land)"></span> Neither</div>
  </div>

  <div id="compare-banner" style="display: none">
    Comparing with <b id="compare-name"></b>
    <button class="btn small" id="compare-exit">Back to my map</button>
  </div>

  <div id="friends-modal" class="modal-backdrop">
    <div class="modal">
      <button class="close" id="friends-close">✕</button>
      <h3>Friends</h3>
      <div id="friends-body"></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="account-modal" class="modal-backdrop">
    <div class="modal">
      <button class="close" id="account-close">✕</button>
      <h3>Account</h3>
      <div id="account-body"></div>
    </div>
  </div>

  <div id="park-card">
    <button class="close">✕</button>
    <div class="photo">🏞️</div>
    <div class="body">
      <h3></h3>
      <div class="sub"></div>
      <div class="actions">
        <button class="toggle-visited">Mark as visited</button>
        <a class="wiki-link" target="_blank" rel="noopener">Wikipedia ↗</a>
      </div>
    </div>
  </div>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="data/my-travels.js"></script>
  <script src="js/countries-meta.js"></script>
  <script src="js/continents.js"></script>
  <script src="js/parks.js"></script>
  <script src="js/store.js"></script>
  <script src="js/account.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
